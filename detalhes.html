<style>
  :root{
    --bg:#f4f7fb;
    --panel:#ffffff;
    --panel-2:#eef4fa;
    --border:#d9e4ef;
    --text:#0b2036;
    --muted:#64778c;
    --orange:#1264d8;
    --orange-dim:#0a3e91;
    --orange-bg: rgba(18,100,216,.10);
    --green:#1f9d67; --green-bg: rgba(31,157,103,.12);
    --blue:#12a8d8;
    --purple:#7A4FD1;
    --red:#c53d48; --red-bg: rgba(197,61,72,.10);
    --amber:#b77a00; --amber-bg: rgba(183,122,0,.12);
    --radius:20px;
    --ink:#0b2036; --line:#d9e4ef; --surface:#fff; --surface-2:#eef4fa; --surface-3:#e8f0f8;
    --brand:#1264d8; --brand-2:#0a3e91; --brand-soft:#e9f2ff; --cyan:#12a8d8;
    --green-soft:#eaf8f1; --amber-soft:#fff6df; --red-soft:#fff0f1;
    --shadow:0 18px 55px rgba(20,50,85,.10); --shadow-sm:0 8px 24px rgba(20,50,85,.08);
    --mono:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:820px;margin:0 auto;padding:28px 20px 80px;}


  a.back{color:var(--muted);font-size:12.5px;text-decoration:none;display:inline-block;margin-bottom:16px;}
  a.back:hover{color:var(--orange);}

  header.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:8px;}
  header.hdr h1{font-size:21px;margin:0;font-weight:800;letter-spacing:-.01em;}
  .hdr-sub{margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .hdr-period{font-size:12.5px;color:var(--muted);margin-top:10px;}

  .badge{font-size:10.5px;padding:3px 9px;border-radius:20px;white-space:nowrap;font-weight:700;letter-spacing:.02em;}
  .badge-cat{background:var(--orange-bg);color:var(--orange);}
  .badge-alta{background:var(--green-bg);color:var(--green);}
  .badge-media{background:var(--amber-bg);color:var(--amber);}
  .badge-baixa{background:var(--red-bg);color:var(--red);}
  .badge-manual{background:var(--orange-bg);color:var(--orange);}
  .badge-cotacao{background:var(--green-bg);color:var(--green);}
  .badge-estimativa{background:var(--amber-bg);color:var(--amber);}
  .badge-gratis{background:var(--green-bg);color:var(--green);}

  .summary{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;
    margin:20px 0 22px;
  }
  .sum-card{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
  .sum-card .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
  .sum-card .val{font-size:18px;font-weight:800;}
  .sum-card.total{background:var(--orange);grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  .sum-card.total .lbl{color:rgba(255,255,255,.8);}
  .sum-card.total .val{color:#fff;font-size:26px;}

  .seguro-aviso{background:var(--amber-soft);border:1px solid rgba(183,122,0,.35);color:#6b4a00;border-radius:14px;padding:12px 14px;margin:0 0 18px;font-size:13px;line-height:1.55;}
  .seguro-aviso strong{color:#5a3e00;}
  .price-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:18px;}
  .price-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;border-bottom:1px dashed var(--border);}
  .price-row:last-child{border-bottom:none;}
  .price-row .k{color:var(--muted);}
  .price-row .v{font-weight:700;}
  .price-row .v.val-muted{color:var(--muted);font-weight:600;font-style:italic;}

  .section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:26px 0 10px;}

  .ano-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;}
  .ano-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:2px solid var(--border);}
  .ano-head .ano-titulo{font-size:15px;font-weight:800;}
  .ano-head .ano-subtotal{font-size:15px;font-weight:800;color:var(--orange);}

  .linha{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;font-size:13px;}
  .linha .k{color:var(--muted);}
  .linha .v{font-weight:700;white-space:nowrap;}
  .linha.sub{padding-left:14px;font-size:12.5px;}
  .linha.sub .k{color:var(--text);}

  .revisoes{margin:4px 0 8px;padding-left:0;}
  .revisao-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0 5px 14px;font-size:12.5px;border-left:2px solid var(--border);margin-bottom:2px;}
  .revisao-item .desc{color:var(--text);}
  .revisao-item .desc .meta{color:var(--muted);font-size:11.5px;}
  .revisao-item .custo{font-weight:700;white-space:nowrap;}
  .revisao-item .custo.gratis{color:var(--green);}

  .sem-schedule{font-size:12px;color:var(--muted);font-style:italic;padding:4px 0 8px;}

  .fontes{margin-top:26px;font-size:12px;color:var(--muted);line-height:1.6;}
  .fontes a{color:var(--blue);}
  .fontes-title{font-weight:700;color:var(--text);margin-bottom:4px;}

  .empty-state{text-align:center;color:var(--muted);padding:80px 20px;font-size:14px;}
  .empty-state .big{font-size:36px;margin-bottom:14px;}
  .empty-state a{color:var(--orange);font-weight:700;}

  footer.note{margin-top:34px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.6;}

  /* Menu hambúrguer — navegação entre páginas */
  .hb-btn{position:fixed;top:18px;left:18px;z-index:300;width:44px;height:44px;border-radius:14px;border:1px solid #c4d4e3;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;box-shadow:var(--shadow-sm);transition:.2s}.hb-btn:hover{transform:translateY(-1px)}.hb-btn span{display:block;width:19px;height:2px;background:var(--ink);border-radius:3px}.hb-overlay{position:fixed;inset:0;background:rgba(5,18,32,.48);z-index:290;opacity:0;pointer-events:none;transition:.2s}.hb-overlay.open{opacity:1;pointer-events:auto}.hb-drawer{position:fixed;top:0;left:0;bottom:0;width:290px;max-width:86vw;background:#fff;z-index:295;transform:translateX(-100%);transition:transform .24s ease;display:flex;flex-direction:column;padding:22px 0;box-shadow:18px 0 50px rgba(5,25,50,.16)}.hb-drawer.open{transform:translateX(0)}.hb-drawer-head{display:flex;align-items:center;justify-content:space-between;padding:0 22px 18px;border-bottom:1px solid var(--line);margin-bottom:10px}.hb-drawer-title{font-weight:900;font-size:14px;letter-spacing:.06em;text-transform:uppercase}.hb-close{background:none;border:0;color:var(--muted);font-size:26px}.hb-link{display:flex;align-items:center;gap:10px;padding:14px 22px;color:var(--ink);text-decoration:none;font-size:14px;border-left:4px solid transparent}.hb-link:hover{background:var(--surface-2)}.hb-link.active{border-left-color:var(--brand);color:var(--brand-2);font-weight:800;background:var(--brand-soft)}

  /* ---- design system compartilhado (topbar + hambúrguer) ---- */
  .topbar{height:78px;display:flex;align-items:center;justify-content:space-between;gap:20px;position:relative;z-index:10;flex-wrap:wrap}.brand-mini{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}.brand-mini img{height:42px;width:auto;filter:drop-shadow(0 7px 12px rgba(18,100,216,.18))}.brand-mini strong{font-size:15px}.brand-mini span{display:block;color:var(--muted);font-size:11px;margin-top:1px}.top-actions{display:flex;gap:10px}.top-pill{border:1px solid var(--line);background:rgba(255,255,255,.78);backdrop-filter:blur(12px);border-radius:999px;padding:8px 13px;font-size:11px;font-weight:700;color:var(--muted)}@media (max-width:900px){.topbar{height:auto;padding:10px 0 10px 54px;}.top-pill{display:none}}
</style>

<script>
(function () {
  "use strict";

  const CAT_LABEL = { BEV: "Elétrico", PHEV: "Híbrido plug-in", HEV: "Híbrido pleno" };
  const CONF_CLASS = { "Alta": "badge-alta", "Media": "badge-media", "Baixa": "badge-baixa", "Manual": "badge-manual" };
  const CONF_LABEL = { "Alta": "confiança alta", "Media": "confiança média", "Baixa": "confiança baixa", "Manual": "override manual" };
  const IPVA_BADGE = {
    aliquota_estado: null,
    generica: { cls: "badge-baixa", label: "baixa confiabilidade", title: "Sem estado escolhido ou sem alíquota pesquisada para esse estado/categoria — estimativa genérica de 4% ao ano sobre o preço de tabela" },
  };
  const MANUT_BADGE = {
    cotacao: { cls: "badge-cotacao", label: "plano de revisão do fabricante", title: "Plano de revisão programada pesquisado especificamente para este modelo" },
    categoria: { cls: "badge-estimativa", label: "estimativa por categoria", title: "Sem plano específico coletado — percentual médio da categoria sobre o preço de tabela" },
    sem_coleta: { cls: "badge-estimativa", label: "estimativa por categoria (coleta em andamento)", title: "A coleta diária de planos de revisão ainda não chegou neste modelo — percentual médio da categoria, atualiza automaticamente quando o dado específico for coletado" },
  };

  function fmtBRL(v) {
    if (v === null || v === undefined || isNaN(v)) return "—";
    const neg = v < 0;
    const abs = Math.abs(Math.round(v));
    const s = "R$ " + abs.toLocaleString("pt-BR");
    return neg ? "(" + s + ")" : s;
  }
  function esc(s) {
    return (s || "").toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function badgeHtml(cls, label, title) {
    return "<span class='badge " + cls + "' title=\"" + esc(title) + "\">" + esc(label) + "</span>";
  }
  function confBadgeHtml(conf, motivo) {
    if (!conf) return "";
    const key = conf.indexOf("Baixa") === 0 ? "Baixa" : conf;
    const cls = CONF_CLASS[key] || "badge-baixa";
    const label = CONF_LABEL[key] || conf;
    return badgeHtml(cls, label, motivo || "");
  }
  function ipvaBadgeHtml(fonte) {
    const b = IPVA_BADGE[fonte];
    return b ? badgeHtml(b.cls, b.label, b.title) : "";
  }
  function manutBadgeHtml(fonte) {
    const b = MANUT_BADGE[fonte] || MANUT_BADGE.sem_coleta;
    return badgeHtml(b.cls, b.label, b.title);
  }

  // ---- Vendidos: emplacamentos por modelo (ranking ABVE, ver
  // claude/vendas-eletrificados-metodologia.md) — cobertura parcial, "sem
  // dado" não significa zero vendas, só que o modelo não apareceu num
  // ranking publicado (mesmo dado já calculado no comparador, propagado
  // via sessionStorage por abrirDetalhes()).
  function vendasRowHtml(D) {
    if (D.vendasSemDado || D.vendasQtd == null) {
      return "<div class='price-row'><span class='k'>Vendidos</span>" +
        "<span class='v val-muted' title='Não apareceu em nenhum ranking ABVE publicado — não significa zero vendas'>sem dado</span></div>";
    }
    const periodoTxt = D.vendasPeriodo ? " (" + esc(D.vendasPeriodo) + ")" : "";
    return "<div class='price-row'><span class='k'>Vendidos" + periodoTxt + "</span><span class='v'>" +
      Number(D.vendasQtd).toLocaleString("pt-BR") + " unidades " +
      badgeHtml("badge-cotacao", "ABVE", "Ranking de emplacamentos da Associação Brasileira do Veículo Elétrico — cobertura parcial, só traz os modelos mais vendidos de cada categoria") +
      "</span></div>";
  }

  // ---- Reconstrói o valor estimado do carro ao fim de cada ano (curva de
  // depreciação anual composta, a mesma usada no cálculo do comparador) e a
  // perda de valor correspondente a cada ano — a soma das perdas anuais bate
  // exatamente com "perdaValor" total mostrado no comparador.
  function buildAnoDepreciacao(D) {
    const anos = D.anos;
    const pct = D.depAnualPct;
    const out = [];
    let anterior = D.precoCompra;
    for (let n = 1; n <= anos; n++) {
      const valorFim = (D.tabela != null && pct != null) ? D.tabela * Math.pow(1 - pct, n) : null;
      const perda = (anterior != null && valorFim != null) ? anterior - valorFim : null;
      out.push({ ano: n, valorFim, perda });
      anterior = valorFim;
    }
    return out;
  }

  function revisoesDoAno(D, ano) {
    if (!D.manutRevisoes) return null;
    return D.manutRevisoes.filter(function (rv) { return rv.ano === ano; });
  }

  function renderRevisoesHtml(D, ano) {
    const revisoes = revisoesDoAno(D, ano);
    if (revisoes === null) {
      const anual = D.manutAnualEstimado;
      return "<div class='sem-schedule'>Sem cronograma de revisão específico coletado para este modelo — valor é uma estimativa anual por categoria" +
        (D.manutFonte ? " " + manutBadgeHtml(D.manutFonte) : "") + ".</div>" +
        "<div class='linha sub'><span class='k'>Estimativa anual de manutenção</span><span class='v'>" + fmtBRL(anual) + "</span></div>";
    }
    if (!revisoes.length) {
      return "<div class='sem-schedule'>Nenhuma revisão programada cai neste ano (intervalo de " + D.manutDado.intervaloMeses + " meses).</div>";
    }
    return "<div class='revisoes'>" + revisoes.map(function (rv) {
      const metaParts = ["mês " + rv.mes];
      if (rv.km != null) metaParts.push(rv.km.toLocaleString("pt-BR") + " km (estimado)");
      return "<div class='revisao-item'>" +
        "<span class='desc'>Revisão nº " + rv.numero + " <span class='meta'>(" + metaParts.join(" · ") + ")</span></span>" +
        "<span class='custo" + (rv.gratis ? " gratis" : "") + "'>" + (rv.gratis ? "Grátis" : fmtBRL(rv.custo)) + "</span>" +
        "</div>";
    }).join("") + "</div>";
  }

  function manutTotalDoAno(D, ano) {
    const revisoes = revisoesDoAno(D, ano);
    const base = revisoes !== null
      ? revisoes.reduce(function (s, rv) { return s + (rv.custo || 0); }, 0)
      : (D.manutAnualEstimado || 0);
    return base + (D.manutExtraAnual || 0);
  }

  function renderFontes(D) {
    const blocos = [];
    if (D.manutDado && ((D.manutDado.fonte && D.manutDado.fonte.length) || D.manutDado.observacoes)) {
      let html = "<div class='fontes-title'>Manutenção/revisão</div>";
      if (D.manutDado.observacoes) html += "<div>" + esc(D.manutDado.observacoes) + "</div>";
      if (D.manutDado.fonte && D.manutDado.fonte.length) {
        html += "<div>" + D.manutDado.fonte.map(function (u) {
          return "<a href='" + esc(u) + "' target='_blank' rel='noopener'>" + esc(u) + "</a>";
        }).join(" · ") + "</div>";
      }
      if (D.manutDado.dataColeta) html += "<div>Coletado em " + esc(D.manutDado.dataColeta) + "</div>";
      blocos.push(html);
    }
    if (!D.vendasSemDado && ((D.vendasFonte && D.vendasFonte.length) || D.vendasObservacoes)) {
      let html = "<div class='fontes-title'>Vendidos (emplacamentos ABVE)</div>";
      if (D.vendasObservacoes) html += "<div>" + esc(D.vendasObservacoes) + "</div>";
      if (D.vendasFonte && D.vendasFonte.length) {
        html += "<div>" + D.vendasFonte.map(function (u) {
          return "<a href='" + esc(u) + "' target='_blank' rel='noopener'>" + esc(u) + "</a>";
        }).join(" · ") + "</div>";
      }
      blocos.push(html);
    }
    return blocos.length ? "<div class='fontes'>" + blocos.join("<br>") + "</div>" : "";
  }

  function render(D) {
    const anoDep = buildAnoDepreciacao(D);
    const anosHtml = anoDep.map(function (a) {
      const energiaAno = D.custoEnergiaMes * 12;
      const manutAno = manutTotalDoAno(D, a.ano);
      const ipvaAno = D.ipvaAnual || 0;
      const subtotal = (a.perda || 0) + energiaAno + manutAno + ipvaAno;
      return "<div class='ano-card'>" +
        "<div class='ano-head'><span class='ano-titulo'>Ano " + a.ano + "</span><span class='ano-subtotal'>" + fmtBRL(subtotal) + "</span></div>" +
        "<div class='linha'><span class='k'>Valor estimado do carro ao fim do ano</span><span class='v'>" + fmtBRL(a.valorFim) + "</span></div>" +
        "<div class='linha'><span class='k'>Perda de valor no ano</span><span class='v'>" + fmtBRL(a.perda) + "</span></div>" +
        "<div class='linha'><span class='k'>Energia/combustível no ano</span><span class='v'>" + fmtBRL(energiaAno) + "</span></div>" +
        "<div class='linha'><span class='k'>Manutenção/revisão no ano</span><span class='v'>" + fmtBRL(manutAno) + "</span></div>" +
        renderRevisoesHtml(D, a.ano) +
        (D.manutExtraAnual ? "<div class='linha sub'><span class='k'>Manutenção extra informada</span><span class='v'>" + fmtBRL(D.manutExtraAnual) + "</span></div>" : "") +
        "<div class='linha'><span class='k'>IPVA no ano</span><span class='v'>" + fmtBRL(ipvaAno) + " " + (D.ipvaAnual != null ? ipvaBadgeHtml(D.ipvaFonte) : "") + "</span></div>" +
        "</div>";
    }).join("");

    const periodoLabel = D.anos + (D.anos === 1 ? " ano" : " anos");

    let priceRows;
    if (D.showPcdCols) {
      priceRows =
        "<div class='price-row'><span class='k'>Preço PCD</span><span class='v'>" + fmtBRL(D.pcd) + "</span></div>" +
        "<div class='price-row'><span class='k'>Preço de tabela</span><span class='v'>" + fmtBRL(D.tabela) + "</span></div>" +
        "<div class='price-row'><span class='k'>Desconto PCD</span><span class='v'>" + (D.descontoPct !== null && D.descontoPct !== undefined ? (D.descontoPct * 100).toFixed(1) + "%" : "—") + "</span></div>";
    } else {
      priceRows = "<div class='price-row'><span class='k'>Preço de tabela</span><span class='v'>" + fmtBRL(D.tabela) + "</span></div>";
    }
    priceRows += vendasRowHtml(D);
    priceRows += "<div class='price-row'><span class='k'>Depreciação anual usada</span><span class='v'>" + (D.depAnualPct != null ? (D.depAnualPct * 100).toFixed(1) + "%" : "—") + "</span></div>";
    priceRows += "<div class='price-row'><span class='k'>Energia/combustível por mês</span><span class='v'>" + fmtBRL(D.custoEnergiaMes) + "</span></div>";
    if (D.comparar) {
      priceRows += "<div class='price-row'><span class='k'>Economia/mês vs. seu carro atual</span><span class='v'>" + fmtBRL(D.economiaMes) + "</span></div>";
      priceRows += "<div class='price-row'><span class='k'>Economia no período (" + periodoLabel + ")</span><span class='v'>" + fmtBRL(D.economiaMes * D.anos * 12) + "</span></div>";
    }

    const html =
      "<header class='hdr'>" +
        "<div><h1>" + esc(D.name) + "</h1>" +
        "<div class='hdr-sub'><span class='badge badge-cat'>" + esc(D.catLabel || CAT_LABEL[D.cat] || D.cat) + "</span>" + confBadgeHtml(D.confianca, D.motivoOverride) + "</div></div>" +
      "</header>" +
      "<div class='hdr-period'>Período escolhido: " + periodoLabel + (D.comparar ? " · comparando com o carro atual" : "") + "</div>" +
      "<div class='summary'>" +
        "<div class='sum-card'><div class='lbl'>Perda de valor</div><div class='val'>" + fmtBRL(D.perdaValor) + "</div></div>" +
        "<div class='sum-card'><div class='lbl'>Energia/combustível</div><div class='val'>" + fmtBRL(D.custoEnergiaPeriodo) + "</div></div>" +
        "<div class='sum-card'><div class='lbl'>Manutenção/revisão</div><div class='val'>" + fmtBRL(D.custoManutencaoPeriodo) + "</div></div>" +
        "<div class='sum-card'><div class='lbl'>IPVA</div><div class='val'>" + fmtBRL(D.ipvaAnual != null ? D.ipvaAnual * D.anos : null) + "</div></div>" +
        "<div class='sum-card total'><div><div class='lbl'>Custo real (" + periodoLabel + ")</div></div><div class='val'>" + fmtBRL(D.custoReal) + "</div></div>" +
      "</div>" +
      "<div class='seguro-aviso'><strong>Seguro não incluído.</strong> O custo do seguro não está sendo calculado porque ele varia muito conforme o perfil de cada motorista — idade, CEP, histórico de sinistros, uso do carro e onde ele fica guardado. Para completar a conta, faça uma cotação com uma seguradora ou corretor.</div>" +
      "<div class='price-card'>" + priceRows + "</div>" +
      "<div class='section-title'>Detalhamento ano a ano</div>" +
      anosHtml +
      renderFontes(D) +
      "<footer class='note'>Custo real = perda de valor + energia/combustível + manutenção/revisão + IPVA, somados ano a ano (sem seguro). O IPVA é projetado como valor anual constante (não reduz com a depreciação do carro). Nenhum valor de manutenção foi inventado — onde não há plano de revisão específico coletado, é usada uma estimativa média por categoria sobre o preço de tabela.</footer>";

    document.getElementById("conteudo").innerHTML = html;
  }

  let D = null;
  try {
    D = JSON.parse(sessionStorage.getItem("custoRealDetalhe") || "null");
  } catch (e) {
    D = null;
  }

  if (!D) {
    document.getElementById("conteudo").innerHTML =
      "<div class='empty-state'><div class='big'>📄</div>Abra os detalhes a partir do <a href='index.html'>comparador Custo Real</a> — clique em \"Detalhes\" em qualquer linha da tabela.</div>";
  } else {
    render(D);
  }
})();
</script>
<script>
// "← voltar ao comparador": volta para a página anterior de verdade (histórico
// do navegador) quando o usuário veio do comparador nesta mesma aba — assim o
// comparador reaparece com os critérios e o ranking que estavam na tela. Se
// não houver página anterior (link aberto direto), segue o link normal, e o
// comparador restaura os critérios salvos na sessão. Dentro do portal de
// abas, volta para a aba "Custo Real" (tab-custoreal.html).
(function () {
  var a = document.querySelector("a.back");
  if (!a) return;
  if (window.self !== window.top) { a.setAttribute("href", "tab-custoreal.html"); return; }
  a.addEventListener("click", function (e) {
    var veioDoComparador = false;
    try {
      var ref = document.referrer ? new URL(document.referrer) : null;
      veioDoComparador = !!ref && ref.origin === location.origin &&
        /(\/|\/CustoReal\.html|\/index\.html)$/.test(ref.pathname);
    } catch (err) {}
    if (veioDoComparador && history.length > 1) { e.preventDefault(); history.back(); }
  });
})();
</script>
